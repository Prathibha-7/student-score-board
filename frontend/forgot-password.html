<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password help · Student Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/config.js"></script>
  <script defer src="/js/common.js"></script>
  <script defer src="/js/forgot-password.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="/">Student Portal</a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Reset your password</h1>
      <p id="reset-intro" class="muted">Enter your email to receive a secure reset link.</p>
      <form id="forgot-form">
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
        <div id="local-fields" class="hidden">
          <label for="dob">Date of birth</label><input id="dob" name="dob" type="date">
          <label for="password">New password</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password">
        </div>
        <div id="token-fields" class="hidden">
          <label for="new-password">New password</label><input id="new-password" name="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password">
          <label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password">
        </div>
        <button class="button primary full" type="submit">Continue</button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footer"><a href="/login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
