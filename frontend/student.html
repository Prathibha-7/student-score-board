<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · Student Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/config.js"></script>
  <script defer src="/js/common.js"></script>
  <script defer src="/js/student.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Student Portal</a><button class="button secondary" data-logout>Log out</button></header>
  <main class="page-shell">
    <section class="welcome panel">
      <div><p class="eyebrow">STUDENT DASHBOARD</p><h1 id="welcome">Welcome</h1><p class="muted">Your submitted profile details are shown below.</p></div>
      <button id="edit-toggle" class="button primary">Edit profile</button>
    </section>
    <section id="profile" class="panel"></section>
    <section id="edit-panel" class="panel hidden">
      <h2>Edit profile</h2><p class="muted">Your email is locked. Update your details and optionally replace your Aadhaar PDF.</p>
      <form id="profile-form" class="form-grid" novalidate>
        <div class="field"><label for="name">Full name</label><input id="name" name="name" maxlength="120" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" readonly></div>
        <div class="field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required></div>
        <fieldset class="field"><legend>Gender</legend><div class="inline-options">
          <label><input type="radio" name="gender" value="Female" required> Female</label><label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Non-binary"> Non-binary</label><label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
        </div></fieldset>
        <div class="field"><label for="qualification">Qualification</label><select id="qualification" name="qualification" required><option>High School</option><option>Diploma</option><option>Bachelor's</option><option>Master's</option><option>Doctorate</option><option>Other</option></select></div>
        <fieldset class="field"><legend>Interests</legend><div class="inline-options">
          <label><input type="checkbox" name="interests" value="Arts"> Arts</label><label><input type="checkbox" name="interests" value="Coding"> Coding</label>
          <label><input type="checkbox" name="interests" value="Music"> Music</label><label><input type="checkbox" name="interests" value="Science"> Science</label>
          <label><input type="checkbox" name="interests" value="Sports"> Sports</label><label><input type="checkbox" name="interests" value="Volunteering"> Volunteering</label>
        </div></fieldset>
        <div class="field"><label for="class_name">Class</label><input id="class_name" name="class_name" required></div>
        <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" required></div>
        <div class="field"><label for="marks">Marks (%)</label><input id="marks" name="marks" type="number" min="0" max="100" step="0.01" required></div>
        <div class="field"><label for="aadhaar">Replace Aadhaar PDF (optional)</label><input id="aadhaar" name="aadhaar" type="file" accept="application/pdf,.pdf"></div>
        <div class="full-span"><p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button class="button primary" type="submit">Save changes</button> <button id="cancel-edit" class="button secondary" type="button">Cancel</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
